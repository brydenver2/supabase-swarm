# =============================================================================
# Traefik v3 Static Configuration
# =============================================================================

# Global Configuration
global:
  checkNewVersion: true
  sendAnonymousUsage: false

# API and Dashboard
api:
  dashboard: true
  insecure: false

# Log Configuration
log:
  level: INFO
  format: json

# Access Logs
accessLog:
  format: json
  fields:
    headers:
      defaultMode: keep

# Entry Points
entryPoints:
  # HTTP entry point (port 80)
  http:
    address: ":80"
    http:
      redirections:
        entryPoint:
          to: https
          scheme: https
          permanent: true

  # HTTPS entry point (port 443)
  https:
    address: ":443"
    http:
      tls:
        certResolver: letsencrypt
        domains:
          - main: "*.${TRAEFIK_DOMAIN}"
            sans:
              - "${TRAEFIK_DOMAIN}"
      middlewares:
        - security-headers@docker

  # PostgreSQL entry point (port 5432)
  postgres:
    address: ":5432"

# Certificate Resolvers
certificatesResolvers:
  # Let's Encrypt resolver
  letsencrypt:
    acme:
      email: ${TRAEFIK_ACME_EMAIL}
      storage: /letsencrypt/acme.json
      # Use TLS-ALPN-01 challenge for better reliability
      tlsChallenge: {}
      # Uncomment for HTTP-01 challenge if needed
      # httpChallenge:
      #   entryPoint: http
      # Use staging server for testing (remove in production)
      # caServer: https://acme-staging-v02.api.letsencrypt.org/directory

# Providers
providers:
  # Docker Swarm provider
  swarm:
    endpoint: "unix:///var/run/docker.sock"
    exposedByDefault: false
    network: supabase_overlay
    watch: true
    refreshSeconds: 15
    constraints: "Label(`traefik.constraint-label`, `supabase_overlay`)"

  # File provider for additional dynamic configuration
  file:
    directory: /etc/traefik/dynamic
    watch: true

# Metrics (optional - uncomment if needed)
# metrics:
#   prometheus:
#     addEntryPointsLabels: true
#     addServicesLabels: true
#     entryPoint: metrics

# Tracing (optional - uncomment if needed)
# tracing:
#   jaeger:
#     samplingType: const
#     samplingParam: 1.0
#     localAgentHostPort: jaeger:6831

# Pilot (optional - Traefik Cloud integration)
# pilot:
#   token: "your-pilot-token"
